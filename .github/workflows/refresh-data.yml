name: Refresh data

# Every hour: FIS documents (start lists, results, media stats, programs) and
# the World Cup standings. A change is committed to main and the site is
# published again.
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      # A push made with GITHUB_TOKEN starts no workflow, so Pages is started
      # by hand, which this token is allowed to do.
      actions: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run documents
      - run: npm run standings
      - run: npx prettier --write src/data/seasons src/data/standings

      - name: Commit and publish
        env:
          GH_TOKEN: ${{ github.token }}
          # The pre-push hook runs the full CI with e2e, which needs browsers
          # this job does not install; the bot only pushes data files.
          HUSKY: 0
        run: |
          if git diff --quiet -- src/data; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data
          git commit -m "chore: refresh FIS documents and standings"
          git pull --rebase origin main
          git push origin HEAD:main
          gh workflow run pages.yml --ref main
